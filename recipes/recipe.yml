---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-bootc-legacy-intel-os
description: "Fedora bootc minimale per Intel Ivy Bridge (BIOS legacy, solo cavo, iGPU) con Niri"
base-image: quay.io/fedora/fedora-bootc
image-version: '45'

modules:
  - from-file: packages.yml

  - type: files
    files:
      - source: system
        destination: /

  - type: script
    snippets:
      - useradd -D -s /usr/bin/bash
      - useradd -M -u 1000 -G wheel -s /usr/bin/bash user
      - usermod -p '' user
      - chage -d 0 user
      - ln -sf /usr/lib/systemd/system/multi-user.target /etc/systemd/system/default.target

  - type: systemd
    system:
      enabled:
        - NetworkManager.service
        - systemd-resolved.service
        - firewalld.service
        - systemd-oomd.service
        - sshd.service
      disabled:
        - NetworkManager-wait-online.service
    user:
      enabled:
        - podman.socket

  - type: script
    snippets:
      - kver="$(ls -1 /usr/lib/modules | sort -V | tail -n1)" && dracut --force --reproducible --no-hostonly --omit "nfs iscsi nvmf mdraid dmraid multipath lvm plymouth" --add bootc --kver "$kver" "/usr/lib/modules/$kver/initramfs.img"

  - from-file: flatpaks.yml

  - type: signing
